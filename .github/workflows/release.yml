name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            # main.js is self-contained: esbuild runs with platform:node, so ws
            # bundles into it. No node_modules to ship — an installed plugin
            # folder has none, and a runtime require of ws fails on load.
            - name: Collect artifacts
              run: |
                  mkdir -p dist
                  cp main.js manifest.json dist/
                  if [ -f styles.css ]; then cp styles.css dist/; fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    dist/main.js dist/manifest.json
